name: ty-transfer

# 云盘 -> 分卷 -> 中转远端/in2 流水线
# 说明: 一个文件下完 -> ffmpeg 分卷 -> 上传 中转远端/in2 -> 云端加 _D 标记
#       -> 源文件改名"已下载_" -> 再处理下一个
# 需要仓库 Secrets: TY_AUTH / TY_CLOUD_ID / RCLONE_CONF

on:
  # 自动运行: 每 6 小时一次 (UTC 0/6/12/18 点 = 北京 8/14/20/2 点)
  #   公开仓库无需再抠额度, 所以单次预算放到 90 分钟(原 14 分钟是为了省私有仓库额度)。
  # 每轮都重新拉 中转远端/报告区 的比对清单, 再决定下载哪些文件
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      max_files:
        description: "本次处理文件数上限(时间预算优先, 兜底防跑太久)"
        required: false
        default: "30"
      max_file_gb:
        description: "单文件大小上限 GB, 超过自动跳过"
        required: false
        default: "15"
      only_name:
        description: "只处理文件名含该子串的文件(留空=全部)"
        required: false
        default: ""
      max_minutes:
        description: "单次运行时间预算(分钟)"
        required: false
        default: "90"

permissions:
  contents: read

env:
  # 盘名/目录名的真值走加密 Secret; 日志里只会显示 ***
  PATHS_JSON: ${{ secrets.PATHS_JSON }}

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 取仓库
        uses: actions/checkout@v4

      - name: 装 ffmpeg 与 rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1 || echo "ffprobe 缺失(有 fallback)"
          curl -s https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/r.zip
          unzip -q -o /tmp/r.zip -d /tmp
          cp /tmp/rclone-*/rclone /usr/local/bin/
          rclone version | head -1
          df -h / | tail -1

      - name: 写 rclone 配置
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          test -s ~/.config/rclone/rclone.conf && echo "rclone 配置已写入"

      - name: 跑传输流水线
        env:
          TY_AUTH: ${{ secrets.TY_AUTH }}
          TY_CLOUD_ID: ${{ secrets.TY_CLOUD_ID }}
          MAX_FILES: ${{ inputs.max_files || '30' }}
          MAX_FILE_GB: ${{ inputs.max_file_gb || '15' }}
          ONLY_NAME: ${{ inputs.only_name }}
          MAX_MINUTES: ${{ inputs.max_minutes || '90' }}
        run: |
          python3 tools/ty_pipeline.py --max-files "$MAX_FILES" \
            --max-file-gb "$MAX_FILE_GB" --max-total-gb 80 \
            --max-minutes "$MAX_MINUTES"
